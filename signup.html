<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar">
    <div class="logo">AI Wardrobe</div>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="wardrobe.html">My Wardrobe</a>
        <a href="stylist.html">AI Stylist</a>
        <a href="explore.html">Explore My Style</a>
        <a href="about.html">About Us</a>
        <a href="signin.html" class="sign-in">Sign In</a>
    </div>
</nav>

<section class="login">

    <div class="login-box">

        <p class="tag">JOIN AI WARDROBE</p>
        <h1>Create Account 💜</h1>
        <p>Start your personal style journey.</p>

        <form id="signupForm" novalidate>

            <label>Full Name</label>
            <input type="text" id="name" placeholder="Enter your name">

            <label>Email</label>
            <input type="email" id="signupEmail" placeholder="Enter your email">

            <label>Password</label>
            <input type="password" id="signupPassword" placeholder="Create password">

            <label>Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm password">

            <button class="btn" type="submit">
                Create Account
            </button>

            <p id="signupMessage"></p>

        </form>

        <p class="account">
            Already have an account?
            <a href="signin.html">Sign In</a>
        </p>

    </div>

</section>
<a href="signup.html">Create one</a>
<script src="signup.js"></script>

</body>
</html>
