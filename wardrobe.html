<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wardrobe</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar">
    <div class="logo">AI Wardrobe</div>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="wardrobe.html">My Wardrobe</a>
        <a href="stylist.html">AI Stylist</a>
        <a href="explore.html">Explore My Style</a>
        <a href="about.html">About Us</a>
        <a href="signin.html" class="sign-in">Sign In</a>
    </div>
</nav>


<section class="page-title">
    <p class="tag">MY CLOSET</p>
    <h1>My Wardrobe 👗</h1>
    <p>Everything you own, all in one place.</p>
</section>


<section class="wardrobe">

    <div class="upload">
        <h2>Add something new</h2>
        <p>Upload your clothes and keep your wardrobe organised.</p>
    <button class="btn" onclick="showForm()">+ Add Clothes</button>
    </div>
  <div id="addForm" style="display:none;">

    <h2>Add New Clothing</h2>

    <form id="clothesForm">
        <input type="text" id="clothName"
               placeholder="Clothing Name" required>

        <select id="clothCategory">
            <option>Tops</option>
            <option>Bottoms</option>
            <option>Dresses</option>
            <option>Shoes</option>
        </select>

        <input type="url" id="clothImage"
               placeholder="Paste Image URL" required>

        <button class="btn" type="submit">Add Item</button>
    </form>

</div>

    <div class="categories">
        <button>All</button>
        <button>Tops</button>
        <button>Bottoms</button>
        <button>Dresses</button>
        <button>Shoes</button>
    </div>


    <div class="clothes">

    </div>

</section>


<footer>
    <p>© 2026 AI Wardrobe • Made with 💜</p>
</footer>
<script src="core.js"></script>
<script src="wardrobe.js"></script>
</body>
</html>
