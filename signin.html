<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar">
    <div class="logo">AI Wardrobe</div>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="wardrobe.html">My Wardrobe</a>
        <a href="stylist.html">AI Stylist</a>
        <a href="explore.html">Explore My Style</a>
        <a href="about.html">About Us</a>
    </div>
</nav>


<section class="login">

    <div class="login-box">

        <p class="tag">WELCOME BACK</p>

        <h1>Sign In 💜</h1>

        <p>Continue your personal style journey.</p>


        <form>

            <label>Email</label>

            <input
                type="email"
                placeholder="Enter your email"
                required>


            <label>Password</label>

            <input
                type="password"
                placeholder="Enter your password"
                required>


            <button class="btn" type="submit">
                Sign In
            </button>

        </form>


        <p class="account">
            Don't have an account?
            <a href="#">Create one</a>
        </p>

    </div>

</section>


<footer>
    <p>© 2026 AI Wardrobe • Made with 💜</p>
</footer>

</body>
</html>
